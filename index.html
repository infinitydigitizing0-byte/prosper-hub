<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prosper Hub · Personal & Business Money</title>
<meta name="description" content="All-in-one money app for your home and your business. Budgets, bills, goals, debt, net worth, invoices, profit & loss. Works offline.">
<meta name="theme-color" content="#F3F6F8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Prosper Hub">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{
  --bg:#F3F6F8; --card:#FFFFFF; --ink:#13293D; --muted:#6B7C8F; --line:#E3E9EF; --soft:#F5F8FA;
  --brand:#0E9F8E; --brand-l:#DDF5F1; --in:#2F80ED; --in-l:#E3EEFD; --out:#E5604D; --out-l:#FCE7E3;
  --save:#8B5CF6; --save-l:#EFE8FE; --debt:#E0962B; --debt-l:#FBF0DD; --ok:#16A34A; --ok-l:#DCF5E5; --warn:#D97706;
  --shadow:0 4px 18px rgba(19,41,61,.07); --r:18px;
  --font: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
[data-theme="dark"]{
  --bg:#0D1724; --card:#152234; --ink:#E6EEF6; --muted:#93A4B8; --line:#24364C; --soft:#1B2B40;
  --brand:#2DD4BF; --brand-l:#123A3A; --in:#6AA8FF; --in-l:#18304F; --out:#FF8A78; --out-l:#3A2026;
  --save:#B79BFF; --save-l:#2A2450; --debt:#F7BF5E; --debt-l:#3A2F1C; --ok:#4ADE80; --ok-l:#163A28; --shadow:0 4px 18px rgba(0,0,0,.35);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-text-size-adjust:100%}
body{min-height:100vh;padding-bottom:calc(80px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.wrap{max-width:1180px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) 14px 24px}
@media(min-width:960px){body{padding-bottom:0;padding-left:250px}.bnav{display:none!important}.snav{display:flex!important}.g2{grid-template-columns:repeat(2,minmax(0,1fr))!important}.g3{grid-template-columns:repeat(3,minmax(0,1fr))!important}.g4{grid-template-columns:repeat(4,minmax(0,1fr))!important}.g21{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)!important}}
@media(min-width:620px) and (max-width:959px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))!important}.g2,.g21{grid-template-columns:repeat(2,minmax(0,1fr))!important}}
.grid{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
.grid>*{min-width:0}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.ttl{font-size:25px;font-weight:900;letter-spacing:-.3px}.sub{color:var(--muted);font-size:13.5px;line-height:1.45}
.card{background:var(--card);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.card h2{font-size:16px;font-weight:900;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.kpi .k{font-size:11.5px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.7px}
.kpi .v{font-size:24px;font-weight:900;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .d{font-size:12.5px;color:var(--muted);margin-top:2px}
.big{font-size:50px;font-weight:900;letter-spacing:-1.5px;line-height:1.05}
.row{display:flex;gap:10px;align-items:center}.row.w{flex-wrap:wrap}.sp{flex:1;min-width:0}
.btn{padding:11px 16px;border-radius:13px;background:var(--brand);color:#fff;font-weight:800;font-size:14.5px;white-space:nowrap}
.btn.g{background:var(--soft);color:var(--ink)}.btn.r{background:var(--out)}.btn.sm{padding:7px 11px;font-size:12.5px;border-radius:10px}
.btn:active,.chip:active{transform:scale(.97)}
.chip{padding:8px 13px;border-radius:999px;background:var(--soft);font-weight:800;font-size:13.5px;border:2px solid transparent}
.chip.on{border-color:var(--brand);background:var(--brand-l);color:var(--brand)}
.chips{display:flex;flex-wrap:wrap;gap:7px}
input,select,textarea{width:100%;padding:11px 13px;border-radius:12px;border:2px solid var(--line);background:var(--soft);outline:none;font-size:16px}
input:focus,select:focus,textarea:focus{border-color:var(--brand)}textarea{min-height:100px;resize:vertical;line-height:1.5}
label.f{display:block;font-size:12px;font-weight:800;color:var(--muted);margin:9px 0 4px}
.amount{font-size:28px;font-weight:900}
.list{display:flex;flex-direction:column}
.it{display:flex;align-items:center;gap:11px;padding:10px 2px;border-bottom:1px solid var(--line)}.it:last-child{border-bottom:0}
.ic{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;font-size:17px;flex:none;background:var(--soft)}
.it .t{font-weight:800;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.it .s{color:var(--muted);font-size:12.5px;margin-top:1px}
.rt{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex:none}
.amt{font-weight:900;font-size:15px;white-space:nowrap}.amt.o{color:var(--out)}.amt.i{color:var(--in)}
.tag{font-size:11px;font-weight:800;padding:3px 8px;border-radius:99px;white-space:nowrap;display:inline-block}
.t-ok{background:var(--ok-l);color:var(--ok)}.t-due{background:var(--debt-l);color:var(--debt)}.t-late{background:var(--out-l);color:var(--out)}.t-in{background:var(--in-l);color:var(--in)}.t-gr{background:var(--soft);color:var(--muted)}
.bar{height:10px;border-radius:99px;background:var(--soft);overflow:hidden}.bar i{display:block;height:100%;border-radius:99px;background:var(--brand)}
.empty{color:var(--muted);font-size:14px;padding:14px 4px;text-align:center}
.seg{display:inline-flex;background:var(--soft);border-radius:12px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{padding:7px 11px;border-radius:9px;font-weight:800;font-size:12.5px;color:var(--muted)}.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 2px 6px rgba(0,0,0,.08)}
.tbl{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);text-align:right;padding:7px 8px;border-bottom:2px solid var(--line);white-space:nowrap;position:sticky;top:0;background:var(--card)}
td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--card)}
tr.tot td{font-weight:900;border-top:2px solid var(--line)}
td.neg{color:var(--out)}td.pos{color:var(--ok)}
.hero{background:linear-gradient(135deg,var(--brand-l),var(--card) 75%);border:2px solid var(--brand-l)}
.hero.neg{background:linear-gradient(135deg,var(--out-l),var(--card) 75%);border-color:var(--out-l)}
.hero .lab{font-size:12.5px;font-weight:900;letter-spacing:1.2px;text-transform:uppercase;color:var(--brand)}.hero.neg .lab{color:var(--out)}
.hero .big{color:var(--brand)}.hero.neg .big{color:var(--out)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;font-size:12.5px;font-weight:800;background:var(--soft)}
.note{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:13px;font-size:13.5px;font-weight:700;line-height:1.4;margin-bottom:7px}
.n-bad{background:var(--out-l);color:var(--out)}.n-ok{background:var(--ok-l);color:var(--ok)}.n-info{background:var(--in-l);color:var(--in)}.n-yay{background:var(--save-l);color:var(--save)}
/* nav */
.bnav{position:fixed;left:0;right:0;bottom:0;background:var(--card);box-shadow:0 -4px 18px rgba(19,41,61,.08);display:flex;justify-content:space-around;padding:7px 4px calc(7px + env(safe-area-inset-bottom));z-index:20}
.bnav button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;font-weight:800;color:var(--muted);padding:4px 6px;border-radius:12px;min-width:56px}
.bnav button b{font-size:20px;line-height:1}.bnav button.on{color:var(--brand);background:var(--brand-l)}
.snav{display:none;position:fixed;left:0;top:0;bottom:0;width:236px;background:var(--card);flex-direction:column;padding:16px 10px;gap:1px;box-shadow:var(--shadow);overflow:auto;z-index:20}
.snav .brand{font-weight:900;font-size:19px;padding:2px 10px 12px;display:flex;gap:8px;align-items:center}
.snav .grp{font-size:10.5px;font-weight:900;letter-spacing:1px;color:var(--muted);text-transform:uppercase;padding:12px 12px 4px}
.snav button.nv{text-align:left;padding:8px 12px;border-radius:11px;font-weight:800;font-size:13.5px;color:var(--muted);display:flex;gap:9px;align-items:center}
.snav button.nv.on{background:var(--brand-l);color:var(--brand)}
.bookbar{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.booksel{display:flex;align-items:center;gap:8px;background:var(--card);box-shadow:var(--shadow);border-radius:14px;padding:6px 8px 6px 12px;font-weight:900}
.booksel select{border:0;background:transparent;padding:4px 2px;font-weight:900;width:auto;font-size:14.5px}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.cal .h{font-size:11px;font-weight:800;color:var(--muted);text-align:center;padding:3px 0}
.cal .d{background:var(--soft);border-radius:11px;min-height:70px;padding:5px;font-size:11px;cursor:pointer;border:2px solid transparent;overflow:hidden}
.cal .d.o{opacity:.35}.cal .d.td{border-color:var(--brand)}.cal .d.sel{background:var(--brand-l)}
.cal .n{font-weight:900;font-size:12.5px}
.cal .m{display:block;font-size:10px;font-weight:800;border-radius:5px;padding:1px 4px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m.b{background:var(--out-l);color:var(--out)}.m.p{background:var(--in-l);color:var(--in)}.m.v{background:var(--save-l);color:var(--save)}.m.s{color:var(--muted)}
@media(max-width:520px){.cal .d{min-height:54px;padding:3px}.cal .m{font-size:8.5px;padding:0 2px}.big{font-size:42px}.kpi .v{font-size:19px}}
.heat{display:grid;grid-template-columns:repeat(31,minmax(0,1fr));gap:2px}.heat i{aspect-ratio:1;border-radius:3px;background:var(--soft);display:block}
.heat i.y{background:var(--ok)}.heat i.n{background:var(--out-l)}.heat i.x{opacity:0}
/* modal */
.modal{position:fixed;inset:0;background:rgba(10,20,35,.45);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.sheet{background:var(--card);width:100%;max-width:600px;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
@media(min-width:700px){.modal{align-items:center}.sheet{border-radius:22px}}
.sheet h3{font-size:19px;font-weight:900;margin-bottom:6px}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--card);padding:11px 16px;border-radius:13px;font-weight:800;z-index:60;max-width:90vw;text-align:center}
.kbd{font-family:ui-monospace,Menlo,Consolas,monospace;background:var(--soft);border-radius:6px;padding:1px 6px;font-size:12px}
.badge{display:flex;gap:12px;align-items:center;padding:12px;border-radius:15px;background:var(--soft)}.badge .e{font-size:26px;width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:var(--card)}.badge.lock{opacity:.45;filter:grayscale(1)}
svg text{fill:var(--muted);font-family:var(--font)}
.check{display:flex;align-items:center;gap:10px;padding:6px 0}.check input[type=checkbox]{width:22px;height:22px;flex:none;accent-color:var(--brand)}.check input[type=text]{padding:8px 11px}
.check.done input[type=text]{text-decoration:line-through;color:var(--muted)}
.inv{background:#fff;color:#13293D;border-radius:14px;padding:26px;border:1px solid var(--line)}
.inv table td,.inv table th{position:static;background:none}
.hide{display:none!important}
#printarea{display:none}
@media print{body{padding:0!important;background:#fff}.bnav,.snav,#app,#layer{display:none!important}#printarea{display:block!important}.inv{border:0}}
</style>
</head>
<body>
<nav class="snav" id="snav"></nav>
<main class="wrap" id="app"></main>
<nav class="bnav" id="bnav"></nav>
<div id="layer"></div>
<div id="printarea"></div>
<noscript><div style="padding:30px;font-family:sans-serif">Please turn on JavaScript, or open Prosper Hub in Safari, Chrome or Edge.</div></noscript>
<script src="js/core.js"></script>
<script src="js/screens-a.js"></script>
<script src="js/screens-b.js"></script>
<script src="js/app.js"></script>
</body>
</html>
